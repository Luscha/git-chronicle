<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 96" width="520" height="96" role="img" aria-label="gitchronicle">
  <style>
    .word { fill: #f2f4f8 }
    .tag  { fill: #9aa3b2 }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cf7"/>
      <stop offset="1" stop-color="#7b5cf0"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#g)"/>
  <!-- a commit graph read downwards: work branches off, and what it became is the bigger
       node at the end — history turned into one catalogued thing -->
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
    <path d="M33 22v52"/>
    <path d="M33 31c0 10 9 11 16 11"/>
  </g>
  <g fill="#fff">
    <circle cx="33" cy="20" r="7.5"/>
    <circle cx="56" cy="42" r="7.5"/>
    <circle cx="33" cy="76" r="11"/>
  </g>
  <text x="118" y="52" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif"
        font-size="34" font-weight="650" class="word" letter-spacing="-0.5">gitchronicle</text>
  <text x="119" y="74" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif"
        font-size="14.5" class="tag">a git repository, as a knowledge base of what was built</text>
</svg>
