[project]
name = "gitchronicle"
version = "0.0.1"
description = "Reconstruct a project's functional-feature chronicles from its git history into a queryable, navigable knowledge base"
readme = "README.md"
authors = [
    { name = "Matteo Roggia", email = "matteo.roggia@gmail.com" }
]
license = "MIT"
keywords = ["git", "knowledge-graph", "documentation", "clustering", "llm", "software-archaeology"]
# 3.11 floor: tomllib is stdlib from 3.11; keeps the tool installable well beyond the dev box.
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "httpx>=0.28.1",
    "igraph>=1.0.0",
    "numpy>=2.0",
    "typer>=0.26.8",
]

[project.optional-dependencies]
# Google Vertex AI as a chat provider: authorises with Application Default Credentials
# instead of an API key. Only needed for providers.*.kind = "vertex".
vertex = ["google-auth>=2.40"]

[project.scripts]
gitchronicle = "gitchronicle:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
