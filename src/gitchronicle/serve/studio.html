<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gitchronicle studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --t-foundation:#2a78d6; --t-framework:#eb6834; --t-feature:#1baf7a;
  --t-tooling:#eda100;    --t-content:#e87ba4; --t-inherited:#a3a7b0; --t-upkeep:#b9a389;
  --bg:#f6f6f7; --panel:#ffffff; --panel-2:#fafafb; --sunken:#f1f1f3;
  --fg:#16171b; --fg-2:#3b3e46; --muted:#6c707b; --faint:#9da1ab;
  --line:#e6e6ea; --line-2:#eeeef1;
  --acc:#5b5bd6; --acc-soft:#efeffd; --acc-line:#c9c9f4;
  --btn:#16171b; --btn-fg:#ffffff;
  --warn:#b45309; --warn-soft:#fdf3e4; --ok:#15803d; --ok-soft:#e9f6ee; --bad:#b91c1c; --bad-soft:#fdecec;
  --mark:#fff1b8;
  --shadow-s:0 1px 2px rgba(15,16,20,.05);
  --shadow:0 1px 2px rgba(15,16,20,.04), 0 6px 24px rgba(15,16,20,.07);
  --shadow-l:0 8px 40px rgba(15,16,20,.16);
  --r:10px;
  --sans:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --t-foundation:#4b93ea; --t-framework:#e8723f; --t-feature:#27b583;
    --t-tooling:#d99a12;    --t-content:#df6b95; --t-inherited:#6b6f78; --t-upkeep:#7d6f5c;
    --bg:#0d0e11; --panel:#15161a; --panel-2:#18191e; --sunken:#1c1d22;
    --fg:#ededf0; --fg-2:#c7c9cf; --muted:#8e929c; --faint:#62666f;
    --line:#26282e; --line-2:#1f2126;
    --acc:#8e8cf5; --acc-soft:#22223d; --acc-line:#3c3b73;
    --btn:#ededf0; --btn-fg:#111215;
    --warn:#e6a24a; --warn-soft:#2e2413; --ok:#5fcb8a; --ok-soft:#14261b; --bad:#f07575; --bad-soft:#2d1616;
    --mark:#4a3f10;
    --shadow-s:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.35);
    --shadow-l:0 8px 40px rgba(0,0,0,.55);
  }
}
* { box-sizing:border-box; margin:0; padding:0 }
html,body { height:100% }
body { background:var(--bg); color:var(--fg); font:14px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased; font-feature-settings:"cv11","ss01" }
button, input, select, textarea { font:inherit; color:inherit }
a { color:var(--acc); text-decoration:none; cursor:pointer }
mark { background:var(--mark); color:inherit; border-radius:2px; padding:0 1px }
.mono { font-family:var(--mono); font-size:12px }
.muted { color:var(--muted) } .faint { color:var(--faint) }
.num { font-variant-numeric:tabular-nums }

/* ---------- shell ---------- */
#app { display:grid; grid-template-columns:232px 1fr; height:100vh }
#side { background:var(--panel); border-right:1px solid var(--line); display:flex;
  flex-direction:column; padding:18px 12px 14px; gap:6px; overflow:auto }
.brand { display:flex; align-items:center; gap:10px; padding:2px 8px 14px }
.brand .logo { width:28px; height:28px; border-radius:8px; display:grid; place-items:center;
  background:linear-gradient(135deg,var(--t-foundation),var(--acc)); color:#fff }
.brand b { font-weight:650; letter-spacing:-.01em; display:block; font-size:14.5px }
.brand span { color:var(--muted); font-size:12px; display:block; margin-top:-2px }
.navh { font-size:11px; font-weight:600; color:var(--faint); text-transform:uppercase;
  letter-spacing:.07em; padding:14px 10px 6px }
.navi { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:8px;
  color:var(--fg-2); cursor:pointer; font-weight:500; user-select:none }
.navi:hover { background:var(--sunken); color:var(--fg) }
.navi.on { background:var(--acc-soft); color:var(--acc) }
.navi svg { width:17px; height:17px; flex:none; opacity:.85 }
.navi .count { margin-left:auto; font-size:11.5px; color:var(--muted); font-weight:500 }
.navi .count.hot { background:var(--warn-soft); color:var(--warn); padding:0 7px; border-radius:99px }
.sidefoot { margin-top:auto; border-top:1px solid var(--line); padding:14px 8px 0;
  font-size:12px; color:var(--muted); display:grid; gap:4px }
.sidefoot b { color:var(--fg-2); font-weight:600 }
#main { overflow:auto; position:relative }
.page { max-width:1180px; margin:0 auto; padding:34px 40px 120px }
.page.wide { max-width:none; padding:0; height:100% }
.ph { display:flex; align-items:flex-end; gap:16px; margin-bottom:22px; flex-wrap:wrap }
.ph h1 { font-size:22px; font-weight:650; letter-spacing:-.02em }
.ph p { color:var(--muted); max-width:72ch; margin-top:4px }
.ph .grow { flex:1; min-width:260px }

/* ---------- controls ---------- */
.btn { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line);
  background:var(--panel); border-radius:8px; padding:6px 12px; cursor:pointer;
  font-weight:500; font-size:13px; color:var(--fg-2); white-space:nowrap; box-shadow:var(--shadow-s) }
.btn:hover { border-color:var(--faint); color:var(--fg) }
.btn.pri { background:var(--btn); color:var(--btn-fg); border-color:var(--btn) }
.btn.pri:hover { opacity:.9 }
.btn.ghost { background:none; box-shadow:none; border-color:transparent; color:var(--muted) }
.btn.ghost:hover { background:var(--sunken); color:var(--fg) }
.btn.bad { color:var(--bad) } .btn.bad:hover { border-color:var(--bad) }
.btn:disabled { opacity:.45; cursor:default }
.btn svg { width:15px; height:15px }
.field { border:1px solid var(--line); background:var(--panel); border-radius:8px;
  padding:7px 11px; font-size:13.5px; outline:none; min-width:0 }
.field:focus { border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-soft) }
.search { position:relative; display:flex; align-items:center }
.search svg { position:absolute; left:10px; width:15px; height:15px; color:var(--faint); pointer-events:none }
.search .field { padding-left:32px; width:100% }
.seg { display:inline-flex; background:var(--sunken); border-radius:9px; padding:3px; gap:2px; flex-wrap:wrap }
.seg button { border:0; background:none; padding:5px 11px; border-radius:7px; cursor:pointer;
  font-size:12.5px; font-weight:500; color:var(--muted); display:inline-flex; align-items:center; gap:6px }
.seg button:hover { color:var(--fg) }
.seg button.on { background:var(--panel); color:var(--fg); box-shadow:var(--shadow-s) }
.seg button small { color:var(--faint); font-weight:500 }
.toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none }
.pill { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:550;
  padding:2px 9px 2px 8px; border-radius:99px; background:var(--sunken); color:var(--fg-2); white-space:nowrap }
.tag { font-size:11px; padding:1px 7px; border-radius:5px; background:var(--sunken); color:var(--muted); font-weight:500 }
.tag.bad { background:var(--bad-soft); color:var(--bad) }
.tag.warn { background:var(--warn-soft); color:var(--warn) }
.tag.ok { background:var(--ok-soft); color:var(--ok) }
.card { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-s) }
.card.pad { padding:18px 20px }
.hint { font-size:12.5px; color:var(--muted); margin-top:6px }
.hint.ok { color:var(--ok) } .hint.err { color:var(--warn) }
.empty { color:var(--muted); padding:28px; text-align:center }
.kbd { font-family:var(--mono); font-size:11px; border:1px solid var(--line); border-bottom-width:2px;
  border-radius:4px; padding:0 5px; color:var(--muted) }

/* ---------- ask ---------- */
.hero { max-width:820px; margin:6vh auto 0; text-align:center }
.hero h1 { font-size:32px; font-weight:700; letter-spacing:-.03em }
.hero .sub { color:var(--muted); margin-top:8px; font-size:14.5px }
.askbox { margin:26px auto 0; display:flex; gap:8px; background:var(--panel); border:1px solid var(--line);
  border-radius:14px; padding:7px 7px 7px 16px; box-shadow:var(--shadow); align-items:center }
.askbox:focus-within { border-color:var(--acc); box-shadow:0 0 0 4px var(--acc-soft), var(--shadow) }
.askbox svg { width:18px; height:18px; color:var(--faint); flex:none }
.askbox input { flex:1; border:0; outline:0; background:none; font-size:16px; padding:8px 4px; min-width:0 }
.chips { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:16px }
.chip { border:1px solid var(--line); background:var(--panel); border-radius:99px; padding:6px 13px;
  font-size:13px; color:var(--fg-2); cursor:pointer }
.chip:hover { border-color:var(--acc-line); color:var(--acc) }
.answer { max-width:820px; margin:26px auto 0; padding:22px 26px; text-align:left }
.answer .lbl { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600;
  color:var(--acc); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px }
.md p { margin:0 0 10px; line-height:1.65 } .md p:last-child { margin:0 }
.md ul, .md ol { margin:0 0 10px 20px; line-height:1.6 } .md li { margin:3px 0 }
.md code { font-family:var(--mono); font-size:12px; background:var(--sunken); padding:1px 5px; border-radius:4px }
.ref { color:var(--acc); background:var(--acc-soft); border-radius:5px; padding:0 5px; cursor:pointer; font-weight:500 }
.ref:hover { text-decoration:underline }
.sources { margin-top:14px; padding-top:12px; border-top:1px solid var(--line); display:flex;
  gap:6px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--muted) }
.skel { height:12px; border-radius:6px; background:linear-gradient(90deg,var(--sunken),var(--line),var(--sunken));
  background-size:200% 100%; animation:sh 1.2s infinite; margin:10px 0 }
@keyframes sh { to { background-position:-200% 0 } }
.results { display:grid; grid-template-columns:1fr 1.3fr 1fr; gap:18px; max-width:1180px; margin:30px auto 0; text-align:left }
.rcol h3 { font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--faint);
  font-weight:600; margin:0 0 8px 2px }
.hit { padding:10px 12px; border-radius:9px; cursor:pointer; border:1px solid transparent }
.hit:hover { background:var(--panel); border-color:var(--line); box-shadow:var(--shadow-s) }
.hit b { font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:7px }
.hit .s { color:var(--muted); font-size:12.5px; margin-top:2px; line-height:1.45;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden }
.hit .d { color:var(--faint); font-size:11.5px }

/* ---------- catalogue ---------- */
table.list { width:100%; border-collapse:separate; border-spacing:0 }
table.list th { text-align:left; font-size:11.5px; font-weight:600; color:var(--faint); padding:8px 12px;
  text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--line); position:sticky; top:0;
  background:var(--bg); z-index:1; cursor:pointer; user-select:none; white-space:nowrap }
table.list th.r, table.list td.r { text-align:right }
table.list td { padding:10px 12px; border-bottom:1px solid var(--line-2); vertical-align:middle }
table.list tr.row { cursor:pointer }
table.list tr.row:hover td { background:var(--panel) }
table.list tr.row.sel td { background:var(--acc-soft) }
.ename { font-weight:600; display:flex; align-items:center; gap:8px }
.edef { color:var(--muted); font-size:12.5px; margin-top:2px; max-width:62ch;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis }

/* ---------- graph ---------- */
#gwrap { position:absolute; inset:0; overflow:hidden; background:
  radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0/22px 22px; }
#gwrap > svg { width:100%; height:100%; display:block; cursor:grab }
#gwrap > svg.panning { cursor:grabbing }
.gpanel { position:absolute; left:18px; top:18px; width:290px; padding:16px; display:grid; gap:12px; z-index:2 }
.gpanel h1 { font-size:17px; font-weight:650; letter-spacing:-.01em }
.legend { display:grid; gap:3px }
.legend button { display:flex; align-items:center; gap:9px; border:0; background:none; cursor:pointer;
  padding:4px 6px; border-radius:6px; font-size:13px; color:var(--fg-2); text-align:left }
.legend button:hover { background:var(--sunken) }
.legend button.off { opacity:.35 }
.legend button small { margin-left:auto; color:var(--faint) }
.ghelp { position:absolute; left:18px; bottom:16px; font-size:12px; color:var(--muted); z-index:2 }
.gzoom { position:absolute; right:18px; bottom:16px; display:flex; gap:6px; z-index:2 }
.node circle { stroke:var(--panel); stroke-width:2; transition:opacity .15s }
.node text { font-weight:550; fill:var(--fg); paint-order:stroke; stroke:var(--bg);
  stroke-width:3.5px; stroke-linejoin:round; pointer-events:none; transition:opacity .15s }
.edge { stroke:var(--faint); stroke-opacity:.45; fill:none; transition:opacity .15s }
svg.focus .node:not(.hot) { opacity:.13 }
svg.focus .edge:not(.hot) { opacity:.06 }
svg.focus .edge.hot { stroke:var(--acc); stroke-opacity:.9 }
.node.sel circle { stroke:var(--fg); stroke-width:2.5 }
.tip { position:fixed; pointer-events:none; background:var(--panel); border:1px solid var(--line);
  border-radius:8px; padding:8px 11px; font-size:12.5px; box-shadow:var(--shadow); z-index:50;
  max-width:320px; display:none }
.tip b { display:block; font-weight:600 }

/* ---------- timeline ---------- */
.pulse { padding:16px 18px 8px; margin-bottom:14px }
.pulse h3, .yr h3 { font-size:13px; font-weight:600 }
.lanes { padding:6px 0 10px; overflow:hidden }
.lanes svg { display:block; width:100% }
.lane:hover .lbg { fill:var(--sunken) }
.lane { cursor:pointer }
.lane text { font-size:12px; fill:var(--fg-2) }
.axis text { font-size:11px; fill:var(--faint) }
.yr { padding:18px 20px; margin-bottom:14px }
.yr .cols { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:12px }
.yr h4 { font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:600; margin-bottom:6px }
.yr .it { padding:5px 0; font-size:13px; cursor:pointer; display:flex; gap:8px; align-items:baseline }
.yr .it:hover b { color:var(--acc) }
.yr .it b { font-weight:550 }
.yr .it span { color:var(--muted); font-size:12px }

/* ---------- drawer ---------- */
#drawer { position:fixed; top:0; right:0; bottom:0; width:min(600px,100vw); background:var(--panel);
  border-left:1px solid var(--line); box-shadow:var(--shadow-l); z-index:30; display:flex; flex-direction:column;
  transform:translateX(102%); transition:transform .22s ease }
#drawer.open { transform:none }
.dh { padding:20px 24px 0; border-bottom:1px solid var(--line) }
.dh .top { display:flex; align-items:center; gap:8px }
.dh h2 { font-size:21px; font-weight:680; letter-spacing:-.02em; margin:10px 0 4px; line-height:1.25 }
.dh .meta { color:var(--muted); font-size:12.5px; display:flex; flex-wrap:wrap; gap:4px 14px }
.dh .meta b { color:var(--fg-2); font-weight:600 }
.tabs { display:flex; gap:2px; margin-top:16px }
.tabs button { border:0; background:none; padding:9px 12px; cursor:pointer; color:var(--muted); font-weight:550;
  font-size:13px; border-bottom:2px solid transparent; margin-bottom:-1px }
.tabs button:hover { color:var(--fg) }
.tabs button.on { color:var(--fg); border-bottom-color:var(--fg) }
.tabs small { color:var(--faint); font-weight:500; margin-left:3px }
.db { flex:1; overflow:auto; padding:20px 24px 90px }
.summary { color:var(--fg-2); line-height:1.65; margin-bottom:16px }
.story { position:relative; margin-top:6px }
.yearmark { font-size:12px; font-weight:700; color:var(--faint); margin:18px 0 8px; letter-spacing:.04em }
.yearmark:first-child { margin-top:0 }
.ch { position:relative; padding:0 0 18px 24px }
.ch::before { content:""; position:absolute; left:5px; top:14px; bottom:-4px; width:2px; background:var(--line) }
.ch:last-child::before { display:none }
.ch .pt { position:absolute; left:0; top:5px; width:12px; height:12px; border-radius:50%;
  background:var(--panel); border:2.5px solid var(--tc, var(--acc)) }
.ch h4 { font-size:14px; font-weight:620; line-height:1.35 }
.ch .when { font-size:12px; color:var(--muted); margin:2px 0 6px }
.ch p { color:var(--fg-2); line-height:1.62; font-size:13.5px }
.ch details { margin-top:6px }
.ch summary { font-size:12px; color:var(--muted); cursor:pointer; list-style:none; display:inline-flex; gap:5px; align-items:center }
.ch summary::-webkit-details-marker { display:none }
.ch summary:hover { color:var(--fg) }
.cm { display:grid; grid-template-columns:auto auto 1fr; gap:2px 10px; margin-top:6px; font-size:12px }
.cm .h { font-family:var(--mono); color:var(--faint); font-size:11.5px }
.cm .dt { color:var(--faint) }
.cm .sj { color:var(--fg-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.authors { font-size:12.5px; color:var(--muted); margin-bottom:14px }
.tree { font-size:13px; margin-top:12px }
.tr { display:flex; align-items:center; gap:6px; padding:4px 6px; border-radius:6px; min-height:30px }
.tr:hover { background:var(--sunken) }
.tr .tw { width:16px; text-align:center; color:var(--faint); cursor:pointer; flex:none; user-select:none }
.tr .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--mono); font-size:12px }
.tr.dir .nm { font-weight:600; color:var(--fg-2); cursor:pointer }
.tr .bar { height:5px; border-radius:3px; background:var(--tc); opacity:.55; flex:none }
.tr .n { color:var(--muted); font-size:11.5px; margin-left:auto; flex:none; padding-left:8px }
.tr .acts { display:none; gap:4px; flex:none }
.tr:hover .acts, .tr.editing .acts { display:flex }
.tr .acts .btn { padding:2px 8px; font-size:12px }
.tr.gone .nm { text-decoration:line-through; color:var(--faint) }
.pickbar { position:sticky; top:-20px; z-index:3; margin:14px -24px 0; padding:12px 24px; background:var(--panel);
  border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:13px }
.pickbar.idle { color:var(--faint); font-size:12.5px; padding:8px 24px }
.tr .ck { flex:none; margin:0 2px; accent-color:var(--acc); cursor:pointer }
.tr.picked { background:var(--acc-soft) }
.explain { background:var(--sunken); border-radius:9px; padding:12px 14px; font-size:12.5px; color:var(--fg-2); line-height:1.55 }
.explain b { font-weight:600 }
.links { display:grid; grid-template-columns:1fr 1fr; gap:20px }
.links h4 { font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:600; margin-bottom:8px }
.lk { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:6px; cursor:pointer; font-size:13px }
.lk:hover { background:var(--sunken) }
.act { display:grid; gap:4px; padding:14px 0; border-bottom:1px solid var(--line-2) }
.act h4 { font-size:13.5px; font-weight:600 }
.act p { font-size:12.5px; color:var(--muted) }
.act .row { display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; align-items:center }

/* ---------- review / rules ---------- */
.rv { padding:18px 20px; margin-bottom:14px }
.rv.done { opacity:.5 }
.rv h3 { font-family:var(--mono); font-size:13.5px; font-weight:500 }
.rv .facts { color:var(--muted); font-size:12.5px; margin:4px 0 12px; display:flex; gap:12px; flex-wrap:wrap }
.rv .cols { display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-bottom:14px }
.rv h4 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:600; margin-bottom:6px }
.hold { display:grid; grid-template-columns:1fr 70px 28px; gap:8px; align-items:center; font-size:12.5px; padding:2px 0 }
.hold .b { height:5px; border-radius:3px; background:var(--acc); opacity:.5 }
.acts { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
.rule { padding:12px 16px; display:flex; gap:14px; align-items:flex-start }
.rule + .rule { border-top:1px solid var(--line-2) }
.rule .body { flex:1; min-width:0 }
.rule .body b { font-weight:600 }
.rule .lines { font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:4px; display:grid; gap:1px }
.rule .kind { width:92px; flex:none; padding-top:2px }
.rgroup { margin:22px 0 8px; font-size:12px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.07em }
textarea.plan { width:100%; min-height:46vh; background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:14px 16px; font-family:var(--mono); font-size:12.5px; line-height:1.6; outline:none; resize:vertical }
textarea.plan:focus { border-color:var(--acc) }

/* ---------- dock ---------- */

<script>

// ---------- tiny DOM helper -----------------------------------------------------------
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "html") e.innerHTML = v;
    else e.setAttribute(k, v === true ? "" : v);

  return e;
}
const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...kids) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs || {}) if (attrs[k] != null) {

}

  x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  spark: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></svg>',

function month(ym) {

  const n = monthsBetween(a, b);

  if (n < 24) return n + " months";

}

let askState = { q: "", hits: null, answer: null, busy: false };
function suggestions() {
  const cat = S.catalogue;
  const out = [];
  const big = cat.filter(r => r.tier === "feature").sort((a, b) => b.commits - a.commits)[0];
  if (big) out.push("How did the " + big.name + " evolve?");
  const hub = cat.slice().sort((a, b) => b.fan_in - a.fan_in)[0];
  if (hub) out.push("What is built on " + hub.name + "?");
  const p = S.timeline.pulse;
  if (p.length) {

    const years = {};
    p.forEach((n, i) => { const y = y0 + Math.floor((m0 + i) / 12); years[y] = (years[y] || 0) + n; });
    const peak = Object.entries(years).sort((a, b) => b[1] - a[1])[0];
    if (peak) out.push("What happened in " + peak[0] + "?");
  }
  const gone = cat.filter(r => r.lifecycle === "removed").sort((a, b) => b.commits - a.commits)[0];
  if (gone) out.push("Why was " + gone.name + " removed?");

  if (fw) out.push("How does " + fw.name + " work?");
  return out;
}

function renderAsk(main) {
  const page = h("div", { class: "page" });

                 icon("search"), inp, btn);

  inp.addEventListener("input", () => {
    askState.q = inp.value; clearTimeout(t);

  });

  page.append(h("div", { class: "hero" },

async function doSearch(q) {
  if (!q.trim()) { askState.hits = null; drawHits(); return; }
  const r = await (await fetch("/api/search?q=" + encodeURIComponent(q))).json();
  if (q !== askState.q && askState.q) return;        // a newer keystroke owns the screen

}

function markdown(src) {
  // escaped first, so nothing the model writes can become markup of its own
  const inline = t => esc(t)
    .replace(/\[\[([^\]]+)\]\]/g, (m, n) => byName.has(n)
      ? '<span class="ref" data-entry="' + esc(n) + '">' + esc(n) + "</span>" : "<b>" + esc(n) + "</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  const out = []; let list = null;
  for (const raw of String(src).split("\n")) {
    const line = raw.trim();
    const li = line.match(/^([-*•]|\d+\.)\s+(.*)$/);
    if (li) {
      const kind = /\d/.test(li[1]) ? "ol" : "ul";

      out.push("<li>" + inline(li[2]) + "</li>");
      continue;
    }
    if (list) { out.push("</" + list.kind + ">"); list = null; }
    if (line) out.push("<p>" + inline(line.replace(/^#+\s*/, "")) + "</p>");
  }
  if (list) out.push("</" + list.kind + ">");
  return out.join("");
}

let catQ = "", catTier = "all", catSort = { k: "commits", dir: -1 };
function sparkline(name, tier, w, hgt) {
  const tl = S.timeline, ent = tl.entries[name];
  const qn = Math.ceil(tl.months / 3);
  const q = new Array(qn).fill(0);
  if (ent) for (const [m, n] of ent.act) q[Math.floor(m / 3)] += n;
  const mx = Math.max(1, ...q);
  const bw = w / qn;
  const g = s("svg", { width: w, height: hgt, viewBox: `0 0 ${w} ${hgt}`, style: "display:block" });
  g.append(s("line", { x1: 0, x2: w, y1: hgt - .5, y2: hgt - .5, stroke: "var(--line)" }));
  q.forEach((n, i) => {
    if (!n) return;
    const bh = Math.max(1.5, Math.sqrt(n / mx) * (hgt - 2));
    g.append(s("rect", { x: i * bw, y: hgt - bh, width: Math.max(1, bw - .6), height: bh, fill: tcol(tier), rx: .6 }));
  });

}

// GRAPH — force-directed

let G = null;                              // layout cache, keyed by the edge set
const gOpts = { isolated: false, hidden: new Set() };

function hash(str) { let x = 2166136261; for (const c of str) x = Math.imul(x ^ c.charCodeAt(0), 16777619); return x >>> 0; }

function forceLayout(nodes, links) {
  // Fruchterman–Reingold with gravity and collision. Seeded from the names, so the same
  // catalogue always lands in the same place and a reload does not reshuffle the map.
  const N = nodes.length; if (!N) return;
  const W = 1600, H = 1100, k = Math.sqrt(W * H / N) * .55;
  nodes.forEach(n => { const a = hash(n.name); n.x = (a % 1000) / 1000 * W - W / 2; n.y = ((a >>> 10) % 1000) / 1000 * H - H / 2; });
  const idx = new Map(nodes.map((n, i) => [n.name, i]));
  const L = links.map(l => [idx.get(l.src), idx.get(l.dst)]).filter(p => p[0] != null && p[1] != null);
  let t = W / 10;
  const dx = new Float64Array(N), dy = new Float64Array(N);
  for (let it = 0; it < 420; it++) {
    dx.fill(0); dy.fill(0);
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      let ex = nodes[i].x - nodes[j].x, ey = nodes[i].y - nodes[j].y;
      let d2 = ex * ex + ey * ey; if (d2 < .01) { ex = .1; ey = .1; d2 = .02; }
      const d = Math.sqrt(d2);
      // hubs push harder: many shared dependents otherwise pile them on top of each other
      let f = k * k / d * (1 + (nodes[i].r + nodes[j].r - 12) / 18);
      const minD = nodes[i].r + nodes[j].r + 14 + (nodes[i].fan >= 3 && nodes[j].fan >= 3 ? 70 : 0);
      if (d < minD) f += (minD - d) * 6;
      dx[i] += ex / d * f; dy[i] += ey / d * f; dx[j] -= ex / d * f; dy[j] -= ey / d * f;
    }
    for (const [a, b] of L) {
      const ex = nodes[a].x - nodes[b].x, ey = nodes[a].y - nodes[b].y;
      const d = Math.sqrt(ex * ex + ey * ey) || .1, f = d * d / k * .9;
      dx[a] -= ex / d * f; dy[a] -= ey / d * f; dx[b] += ex / d * f; dy[b] += ey / d * f;
    }
    for (let i = 0; i < N; i++) {
      const n = nodes[i];
      // gravity grows with distance, so a small separate cluster stays in sight of the
      // main one instead of being pushed off the page; a little flatter than round
      dx[i] -= n.x * .16 * k / 40; dy[i] -= n.y * .22 * k / 40;
      const d = Math.sqrt(dx[i] * dx[i] + dy[i] * dy[i]) || 1;
      n.x += dx[i] / d * Math.min(d, t); n.y += dy[i] / d * Math.min(d, t);
    }
    t = Math.max(1, t * .985);
  }
  packComponents(nodes, L);
}

function packComponents(nodes, L) {
  // Repulsion pushes unconnected clusters apart without limit, and fitting the view to the
  // gap between them shrinks everything to specks. Lay the clusters side by side instead.
  const adj = nodes.map(() => []);
  for (const [a, b] of L) { adj[a].push(b); adj[b].push(a); }
  const comp = new Array(nodes.length).fill(-1), comps = [];
  nodes.forEach((_, i) => {
    if (comp[i] >= 0) return;
    const c = [], st = [i]; comp[i] = comps.length;
    while (st.length) { const v = st.pop(); c.push(v); for (const w of adj[v]) if (comp[w] < 0) { comp[w] = comps.length; st.push(w); } }
    comps.push(c);
  });
  if (comps.length < 2) return;
  comps.sort((a, b) => b.length - a.length);
  const box = c => { const xs = c.map(i => nodes[i].x), ys = c.map(i => nodes[i].y);
    return { x0: Math.min(...xs) - 30, x1: Math.max(...xs) + 30, y0: Math.min(...ys) - 30, y1: Math.max(...ys) + 30 }; };
  const main = box(comps[0]);
  let x = main.x1 + 40, y = main.y0, colW = 0;
  for (const c of comps.slice(1)) {
    const b = box(c), w = b.x1 - b.x0, hh = b.y1 - b.y0;
    if (y + hh > main.y1 && y > main.y0) { y = main.y0; x += colW + 30; colW = 0; }
    for (const i of c) { nodes[i].x += x - b.x0; nodes[i].y += y - b.y0; }
    y += hh + 20; colW = Math.max(colW, w);
  }
}

function graphData() {
  const connected = new Set(); for (const e of S.edges) { connected.add(e.src); connected.add(e.dst); }
  const nodes = S.catalogue.filter(r => (gOpts.isolated || connected.has(r.name)) && !gOpts.hidden.has(r.tier))
    .map(r => ({ name: r.name, tier: r.tier, fan: r.fan_in, files: r.n_files, commits: r.commits,
                 r: 6 + Math.sqrt(r.fan_in || 0) * 4 }));
  const keep = new Set(nodes.map(n => n.name));
  const links = S.edges.filter(e => keep.has(e.src) && keep.has(e.dst));
  const key = nodes.map(n => n.name).join("|") + "#" + links.length;
  if (!G || G.key !== key) {
    const prev = G ? new Map(G.nodes.map(n => [n.name, n])) : new Map();
    forceLayout(nodes, links);
    for (const n of nodes) { const p = prev.get(n.name); if (p && p.pinned) { n.x = p.x; n.y = p.y; n.pinned = true; } }
    G = { key, nodes, links, view: null };
  }
  return G;
}

// ---- files: the territory as a tree, and the place an entry is split apart
function buildTree(paths) {
  const root = { name: "", path: "", kids: new Map(), n: 0, file: false };
  for (const p of paths) {
    let cur = root; cur.n++;
    const parts = p.split("/");
    parts.forEach((part, i) => {
      const path = parts.slice(0, i + 1).join("/");
      if (!cur.kids.has(part)) cur.kids.set(part, { name: part, path, kids: new Map(), n: 0, file: i === parts.length - 1 });
      cur = cur.kids.get(part); cur.n++;
    });
  }
  // a directory with a single child directory is one step, not two
  const squash = node => {
    for (const k of [...node.kids.keys()]) {
      let c = node.kids.get(k);
      while (!c.file && c.kids.size === 1 && !([...c.kids.values()][0].file)) {
        const only = [...c.kids.values()][0];
        c = { ...only, name: c.name + "/" + only.name };
      }
      node.kids.set(k, c); squash(c);
    }
  };
  squash(root);
  return root;
}

// Naming is where curation goes wrong silently: "Luna" next to "Luna Scripting System"
// does not extend it, it carves a new entry out of it; "ccc" beside "CCC" is two products.
function judgeName(v, self) {
  v = v.trim();
  if (!v) return { cls: "", text: "" };
  const exact = byName.get(v);
  if (exact) return { cls: "ok", text: "↳ joins the existing entry “" + v + "” (" + fmt(exact.n_files) + " files, " + exact.tier + ")", tier: exact.tier };
  const pending = pendingNames();
  if (pending.includes(v)) return { cls: "ok", text: "↳ joins “" + v + "”, which your rules declare" };
  const all = [...byName.keys(), ...pending].filter(n => n !== self);
  const low = v.toLowerCase();
  const same = all.find(n => n.toLowerCase() === low);
  if (same) return { cls: "err", text: "⚠ “" + same + "” exists and differs only in capitalisation — this would make a second entry." };
  const near = all.filter(n => n.toLowerCase().includes(low) || low.includes(n.toLowerCase()));
  if (near.length) return { cls: "err", text: "⚠ New entry — close to " + near.slice(0, 3).map(n => "“" + n + "”").join(", ") + ". Pick the exact name to join one." };
  return { cls: "", text: "+ creates a new entry “" + v + "”" };
}

async function decompose(from, nodes, to, newTier) {
  const globs = nodes.map(n => n.file ? n.path : n.path + "/**");
  // Both halves are written: the reject releases the files from this entry, and the claim
  // gives them their new home — first matching rule wins, so a claim alone could lose to an
  // earlier, broader one.
  addToEntry(from, globs.map(g => "  reject " + g));
  // `from` scopes the claim to this entry's files: the folder in its tree is not the
  // folder in the repo, and Client-Files/** alone would take 1,345 files instead of 152
  if (to) addToEntry(to, globs.map(g => "  claim  " + g + ' from "' + from + '"').concat(newTier ? ["  tier   " + newTier] : []));
  for (const n of nodes) pendingMoves.push({ from, path: n.path, to, n: n.file ? 1 : n.n });
  picked.clear();
  await afterEdit();
  drawer(from);
  toast(to ? "Assigned to " + to + " — save to apply" : "Removed — save to apply");

function parsePlan(text) {
  const lines = text.split("\n"), blocks = [];
  let cur = null;
  lines.forEach((raw, i) => {
    const t = raw.split("#")[0].trim();
    if (!t) return;
    const verb = t.split(/\s+/)[0].toLowerCase(), rest = t.slice(verb.length).trim();
    if (verb === "entry") {
      cur = { kind: "entry", name: rest.replace(/^["']|["']$/g, ""), from: i, to: i, claims: [], rejects: [], tier: null, note: null };
      blocks.push(cur);
    } else if (verb === "merge" || (verb === "reject" && /^["']/.test(rest)) || verb === "keep-split") {
      const b = { kind: verb === "reject" ? "hide" : verb, text: t, from: i, to: i, arg: rest };
      if (verb === "merge") { const m = rest.match(/["']([^"']*)["']\s*->\s*["']([^"']*)["']/); if (m) { b.src = m[1]; b.dst = m[2]; } }
      if (verb === "reject") b.name = rest.replace(/^["']|["']$/g, "");
      blocks.push(b); cur = null;
    } else if (cur) {
      cur.to = i;
      if (verb === "claim") cur.claims.push(rest);
      else if (verb === "reject") cur.rejects.push(rest);
      else if (verb === "tier") cur.tier = rest;
      else if (verb === "note") cur.note = rest;
    }
  });

}
function pendingNames() { return parsePlan(planText).filter(b => b.kind === "entry").map(b => b.name); }

function addToEntry(name, lines) {

  const all = planText.split("\n");
  if (b) {
    const have = new Set(all.slice(b.from, b.to + 1).map(l => l.trim().replace(/\s+/g, " ")));
    let add = lines.filter(l => !have.has(l.trim().replace(/\s+/g, " ")));
    if (add.some(l => /^\s*tier\s/.test(l))) {
      for (let i = b.to; i > b.from; i--) if (/^\s*tier\s/.test(all[i])) { all.splice(i, 1); b.to--; }
    }
    all.splice(b.to + 1, 0, ...add);
    planText = all.join("\n");
  } else {
    planText = planText.replace(/\s*$/, "") + "\n\nentry \"" + name + "\"\n" + lines.join("\n") + "\n";
  }
  dirty++;
}
function tidyPlan() {
  // fold repeated `entry` blocks into the first one, keeping every line and comment
  const lines = planText.split("\n");
  const blocks = parsePlan(planText).filter(b => b.kind === "entry");
  const first = new Map(), extra = new Map(), drop = new Set();
  for (const b of blocks) {
    if (!first.has(b.name)) { first.set(b.name, b); continue; }
    const body = lines.slice(b.from + 1, b.to + 1);
    extra.set(b.name, (extra.get(b.name) || []).concat(body));
    for (let i = b.from; i <= b.to; i++) drop.add(i);
  }
  if (!drop.size) return 0;
  const out = [];
  lines.forEach((l, i) => {
    if (drop.has(i)) return;
    out.push(l);
    for (const [name, b] of first) if (b.to === i && extra.has(name)) {
      const have = new Set(lines.slice(b.from, b.to + 1).map(x => x.trim().replace(/\s+/g, " ")));
      let tierSeen = lines.slice(b.from, b.to + 1).some(x => /^\s*tier\s/.test(x));
      for (const x of extra.get(name)) {
        const k = x.trim().replace(/\s+/g, " ");
        if (!k || have.has(k)) continue;
        if (/^tier\s/.test(k)) { if (tierSeen) continue; tierSeen = true; }
        have.add(k); out.push(x);
      }
    }
  });
  planText = out.join("\n").replace(/\n{3,}/g, "\n\n");
  dirty++;
  return drop.size;
}
function addLine(text) { planText = planText.replace(/\s*$/, "") + "\n\n" + text + "\n"; dirty++; }

      h("div", { class: "row" }, note, h("button", { class: "btn", onclick: () => {

        else addToEntry(r.name, ["  note   " + v]);
        done("Note saved to rules"); } }, "Save note"))),
    h("div", { class: "act", style: "border:0" }, h("h4", null, "Hide"), h("p", null, "Not a real thing — never propose it again. Its files go back to the pool."),
      h("div", { class: "row" }, h("button", { class: "btn bad", onclick: () => { addLine('reject "' + r.name + '"'); done("Hidden: " + r.name); } }, "Hide this entry"))));
}

function renderReview(main) {
  const page = h("div", { class: "page", style: "max-width:980px" });
  const open = S.trees.filter(t => !t.handled), done = S.trees.filter(t => t.handled);

  for (const t of open.slice(0, 40)) page.append(reviewCard(t));

}
function reviewCard(t) {

    h("div", { class: "cols" },

function renderRules(main) {

  page.append(h("div", { class: "ph" }, h("div", { class: "grow" }, h("h1", null, "Rules"),
    h("p", null, "Your curation, stored in ", h("span", { class: "mono" }, S.plan_path), ". It is replayed from scratch on every rebuild, "
      + "so there is no history to unwind: editing a rule changes what it does, deleting it undoes it completely."))));
  const blocks = parsePlan(planText);
  const groups = [["entry", "Entries"], ["merge", "Merges and renames"], ["hide", "Hidden"], ["keep-split", "Correctly split folders"]];
  const dup = {}; for (const b of blocks) if (b.kind === "entry") dup[b.name] = (dup[b.name] || 0) + 1;
  const nDup = Object.values(dup).filter(n => n > 1).length;
  if (nDup) page.append(h("div", { class: "card pad", style: "display:flex;gap:14px;align-items:center;margin-bottom:8px" },
    h("div", { style: "flex:1" }, h("b", null, nDup + " entries are declared in several places. "),
      h("span", { class: "muted" }, "They already act as one; tidying folds each into a single block so the file reads that way too.")),
    h("button", { class: "btn", onclick: () => { tidyPlan(); afterEdit().then(render); } }, "Tidy")));
  if (!blocks.length) page.append(h("div", { class: "card pad empty" }, "No rules yet. Start in ", h("a", { onclick: () => go("review") }, "Review"),
    " or open any entry and split it."));
  for (const [kind, title] of groups) {
    const bs = blocks.filter(b => b.kind === kind); if (!bs.length) continue;

    for (const b of bs) {
      const del = h("button", { class: "btn ghost", title: "Delete this rule", onclick: () => {
        const all = planText.split("\n"); all.splice(b.from, b.to - b.from + 1);
        planText = all.join("\n").replace(/\n{3,}/g, "\n\n"); dirty++; afterEdit().then(render); } }, icon("x"));
      let bodyEl;
      if (b.kind === "entry") {
        const c = byName.get(b.name);
        bodyEl = h("div", { class: "body" },
          h("div", null, h("b", null, c ? h("a", { onclick: () => openEntry(b.name) }, b.name) : b.name),
            b.tier ? h("span", { style: "margin-left:8px" }, tierPill(b.tier)) : null,
            !c ? h("span", { class: "tag", style: "margin-left:8px" }, "new on rebuild") : null,
            dup[b.name] > 1 ? h("span", { class: "tag warn", style: "margin-left:8px" }, "declared " + dup[b.name] + "× — combines") : null),
          h("div", { class: "lines" }, [...b.claims.map(g => "claim  " + g), ...b.rejects.map(g => "reject " + g), b.note ? "note   " + b.note : null]
            .filter(Boolean).map(t => h("div", null, t))));
      } else if (b.kind === "merge") {
        bodyEl = h("div", { class: "body" }, h("b", null, b.src || b.arg), h("span", { class: "muted" }, "  →  "), h("b", null, b.dst || ""));
      } else if (b.kind === "hide") {

  ta.value = planText;
  ta.addEventListener("input", () => { planText = ta.value; dirty++; dock(); });
  page.append(h("details", { style: "margin-top:26px" }, h("summary", { class: "muted", style: "cursor:pointer;margin-bottom:10px" }, "Edit as text"), ta));
  main.append(page);
}

// =========================================================================================
// DOCK — unsaved rules, preview, save, rebuild
// =========================================================================================
let rebuildState = null, pvOpen = false;
async function afterEdit() {
  const r = await preview();
  if (r && r.trees) S.trees = r.trees;
  index(); dock();
  if (route.view === "review" || route.view === "rules") render();
}
async function preview() {
  return (await fetch("/api/preview", { method: "POST", headers: { "Content-Type": "application/json" },
                                        body: JSON.stringify({ plan: planText }) })).json();
}
function dock() {
  const d = $("dock");
  if (rebuildState && rebuildState.running) {
    d.replaceChildren(h("span", { class: "spin" }), h("span", null, "Rebuilding the knowledge base" + (rebuildState.stage ? " — " + rebuildState.stage : "") + "…"));
    d.classList.add("show"); return;
  }
  if (rebuildState && rebuildState.code != null && rebuildState.code !== 0) {
    d.replaceChildren(h("span", null, "Rebuild failed (exit " + rebuildState.code + "): " + (rebuildState.tail || []).slice(-1)[0]),
      h("button", { class: "btn", onclick: () => { rebuildState = null; dock(); } }, "Dismiss"));
    d.classList.add("show"); return;
  }
  const changed = planText !== savedPlan;
  if (changed) {
    d.replaceChildren(h("span", { title: "Nothing changes until you save" + (S.can_rebuild ? " and rebuild" : "") }, h("b", null, "Unsaved rules")),
      h("button", { class: "btn", onclick: togglePreview }, pvOpen ? "Hide preview" : "Preview"),
      h("button", { class: "btn", onclick: () => { planText = savedPlan; dirty = 0; pendingMoves.length = 0; pvOpen = false; $("pvpop").classList.remove("show"); afterEdit().then(() => { render(); drawer(route.entry); }); } }, "Discard"),
      h("button", { class: "btn pri", onclick: save }, S.can_rebuild ? "Save & rebuild" : "Save"));
    d.classList.add("show");
  } else d.classList.remove("show");
}
async function togglePreview() {
  const p = $("pvpop");
  pvOpen = !pvOpen; dock();
  if (!pvOpen) { p.classList.remove("show"); return; }
  const r = await preview();
  p.replaceChildren();
  if (r.error) { p.append(h("div", { class: "hint err" }, r.error)); p.classList.add("show"); return; }
  p.append(h("h3", { style: "font-size:14px" }, "What the rebuild will change"),
    h("div", { class: "hint" }, fmt(r.report.moved) + " files change owner · " + fmt(r.report.claimed) + " newly claimed · "
      + fmt(r.report.released || 0) + " released · " + r.report.merges + " merges"));
  for (const w of r.warnings || []) p.append(h("div", { class: "hint err" }, "⚠ " + w));
  if (r.moves.length) p.append(h("table", null, r.moves.map(m => h("tr", null, h("td", null, m.name),
    h("td", { class: "num muted", style: "text-align:right" }, fmt(m.before) + " → " + fmt(m.after)),
    h("td", { style: "text-align:right" }, m.new ? h("span", { class: "tag ok" }, "new") : m.gone ? h("span", { class: "tag bad" }, "gone")
      : h("span", { class: "num " + (m.after > m.before ? "" : "muted") }, (m.after > m.before ? "+" : "") + (m.after - m.before)))))));
  else p.append(h("div", { class: "muted", style: "margin-top:8px" }, "No file changes owner (tiers, notes and names still apply)."));
  p.classList.add("show");
}
function toast(msg) {
  const t = h("div", { class: "card", style: "position:fixed;top:16px;right:16px;padding:10px 14px;z-index:70;font-size:13px;box-shadow:var(--shadow)" }, "✓ " + msg);
  document.body.append(t); setTimeout(() => t.remove(), 2200);
}
async function save() {
  const r = await (await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" },
                                              body: JSON.stringify({ plan: planText }) })).json();
  if (r.error) { showErr(r.error); return; }
  savedPlan = planText; dirty = 0; pvOpen = false; $("pvpop").classList.remove("show");
  if (!S.can_rebuild) { toast("Saved — run  gitchronicle update  to rebuild"); dock(); return; }
  await fetch("/api/rebuild", { method: "POST" });
  pollRebuild();
}
async function pollRebuild() {
  rebuildState = await (await fetch("/api/rebuild")).json();
  dock();
  if (rebuildState.running) { setTimeout(pollRebuild, 1500); return; }
  if (rebuildState.code === 0) {
    rebuildState = null; pendingMoves.length = 0; storyCache.clear(); G = null;
    await load(); drawer(route.entry); toast("Knowledge base rebuilt");
  }
}

const VIEWS = { ask: renderAsk, catalogue: renderCatalogue, graph: renderGraph, timeline: renderTimeline, review: renderReview, rules: renderRules };
route = parseHash();
load().then(async () => {
  const d = $("drawer"); d.style.transition = "none";      // a reload lands open, it does not slide
  await drawer(route.entry);
  requestAnimationFrame(() => requestAnimationFrame(() => { d.style.transition = ""; })); fetch("/api/rebuild").then(r => r.json()).then(st => { if (st.running) pollRebuild(); }); });
