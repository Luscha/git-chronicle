# gitchronicle — copy to `config.toml` and edit. `config.toml` is git-ignored.
#   cp config.example.toml config.toml && gitchronicle doctor
# CLI flags (--repo, --rev, --db) override anything here.

[repo]
path = "/path/to/your/repo"
# The DEFAULT BRANCH's full history: every commit reachable from its tip, which includes
# everything merged into it. Anchor on the branch, not on whatever is checked out.
# Omit this line and you get "HEAD" — the whole history of the current checkout.
rev_range = "origin/main"

[db]
# The working database: commits, concerns and the model cache. Keep it; it is what makes
# a rebuild free.
path = "build/work.db"

[output]
kb = "build/kb.db"        # the knowledge base `update` rebuilds
kb_dir = "build/kb"       # dossiers + kb.html

[untangle]
workers = 8               # concurrent model calls; lower it if your provider rate-limits

# --- models: where they live, and which one does which job -------------------------
# gitchronicle brings NO endpoint, NO key and no vendor of its own. Two tables:
#
#   [endpoints.<name>]   a protocol, an address, and how to authenticate
#   [roles.<role>]       which endpoint and model does which job
#
# One endpoint and one model is a complete configuration; every role falls back to `chat`.
#
#   roles:  chat       the default — every job that names no model of its own
#           untangle   one call per commit — the bulk of the bill. A 14-32B model is the
#                      sweet spot; <=3B is too weak to be useful, 7B is the floor
#           naming     produces the names in your catalogue. PIN IT: changing this model
#                      renames everything (once: 118 entries "gone", 125 "new")
#           narration  writes the stories. Modest volume; pick for prose
#           answer     answering questions (`ask`, the studio). A few calls, the slow ones
#           judge      grading in `eval` — worth a different model from the one answering
#
# `gitchronicle models` prints what this resolves to; `--available` asks an endpoint which
# models it can run; `gitchronicle doctor` checks each one answers.

[endpoints.mine]
kind    = "openai"        # sugar for an address: openai, gemini, vertex, anthropic, ollama,
                          # azure, groq, together, openrouter, scaleway, deepinfra,
                          # fireworks, mistral, xai, deepseek, llamacpp, lmstudio, vllm,
                          # litellm — or write the four fields yourself (below)
api_key = "env:OPENAI_API_KEY"   # "env:VAR" · "file:/run/secrets/key" · or the key itself

[roles.chat]
model       = "gpt-4o-mini"
think       = "off"       # or a budget (128, 1024) or "low"|"medium"|"high".
                          # Reasoning is billed as OUTPUT and is most of the wait: it was
                          # 52% of all untangle tokens here, and turning it off took
                          # 6,574 commits from $30 and ~5h to $7.51 and 30 min.
                          # Some models refuse 0 (gemini-2.5-pro) — cap them instead.
temperature = 0.0
seed        = 7

# An endpoint nothing here has a row for is just its four fields:
# [endpoints.anything]
# protocol = "openai"                        # openai | anthropic | ollama
# base_url = "https://llm.internal/v1"
# auth     = "header:x-api-key"              # bearer | header:<name> | query:<name> | adc | none
# api_key  = "file:/run/secrets/llm"
# dialect  = "openai"                        # openai | google | anthropic | ollama | none
# headers  = { x-org = "acme" }              # anything else the endpoint in front needs
# params   = { max_tokens = 4096 }           # anything else the model accepts
#
# For a provider that speaks none of the three protocols, put a LiteLLM or OpenRouter proxy
# in front and point an endpoint at it — that is the OpenAI protocol.

# A local model needs no key:
# [endpoints.local]
# kind = "ollama"                            # http://localhost:11434/v1
# [roles.untangle]
# endpoint = "local"
# model    = "qwen2.5-coder:14b"
# think    = "off"

# Google, two ways:
# [endpoints.gemini]
# kind    = "gemini"                         # AI Studio, an API key
# api_key = "env:GEMINI_API_KEY"
# [endpoints.vertex]
# kind     = "vertex"                        # your GCP project, Application Default
# project  = "my-gcp-project"                # Credentials — no key
# location = "us-central1"
#   gcloud auth application-default login && pip install -e '.[vertex]'

# Azure wants its deployment URL and an api-version:
# [endpoints.azure]
# kind        = "azure"
# base_url    = "https://my-resource.openai.azure.com/openai/deployments/my-deployment"
# api_version = "2024-10-21"
# api_key     = "env:AZURE_OPENAI_KEY"

# Pin naming to whatever named the catalogue first; those answers are cached, so it is
# free to keep while `chat` moves on.
# [roles.naming]
# endpoint = "mine"
# model    = "gpt-4o-mini"

# --- optional ----------------------------------------------------------------------
# Prices per MILLION tokens, for `gitchronicle cost`. Yours may differ; unpriced models
# still report their tokens.
# [pricing."gpt-5-mini"]
# input = 0.25
# output = 2.00

# Golden probes: things you KNOW are one framework, as a path fragment. The rebuild is
# refused when the assembly scatters one of them (70% of its concerns must share a
# cluster). Repo-specific by nature — there is no useful default.
# [lineage.golden]
# scripting = "/scripting/"

# [lineage]
# canonical_paths = true   # territory speaks in each file's CURRENT name (renames resolved)
