# gitchronicle configuration — copy this to `config.toml` and edit.
#   cp config.example.toml config.toml
# `config.toml` is git-ignored (it holds your local paths); this template is committed.
# CLI flags (--repo, --rev, --db, --out) override anything here. Algorithm params not shown
# have sensible generic defaults (see src/gitchronicle/config.py DEFAULTS) — no per-repo tuning.

[repo]
path = "/path/to/your/repo"
# Analyse the DEFAULT BRANCH's full history: every commit reachable from its tip — which INCLUDES
# all merged-PR commits (they became ancestors when merged), while never-merged feature branches
# are naturally excluded. Merge commits are skipped in untangle (their content is the individual
# commits they merge). Anchor at the default branch, not the ambient checkout.
rev_range = "origin/master"   # e.g. "origin/main", or a range like "v1.0..origin/master"

[db]
path = "build/gitchronicle.db"

[catalog]
# How domains are formed from concerns:
#   "taxonomy" = induce a fixed feature taxonomy once (clustered facets, contrastive naming,
#                definitions), then classify every concern against it BY ID; drift becomes
#                provisional features + an optional review seam. (Recommended, default.)
#   "leiden"   = embedding clustering of concern labels (no chat LLM, no naming; legacy).
method = "taxonomy"

[untangle]
workers = 6   # concurrent LLM calls; lower this if your provider rate-limits (HTTP 429)

# OPTIONAL golden probes: things you know are ONE framework, as a path fragment. The
# rebuild is refused when the assembly scatters one of them (>=70% must share a cluster).
# [lineage.golden]
# scripting = "/scripting/"

[output]
html = "build/graph.html"    # interactive knowledge-base browser (self-contained HTML)
json = "build/domains.json"  # machine-readable export to build your own site on top of

# --- providers (any OpenAI-compatible endpoint; secrets read from .env via env: prefix) ---
# GOOGLE VERTEX: set kind = "vertex" on a chat role to spend Vertex credits. There is no
# api_key — it authorises with Application Default Credentials (`gcloud auth application-
# default login`), and base_url is derived from project/location unless you set it:
#     [providers.chat]
#     kind = "vertex"
#     project = "my-gcp-project"     # optional: defaults to the project ADC carries
#     location = "us-central1"       # or "global"
#     model = "google/gemini-2.5-flash"
# Embeddings must NOT use kind="vertex" (no OpenAI-compatible embeddings endpoint there) —
# leave [providers.embed] on Ollama. Needs the extra: pip install 'gitchronicle[vertex]'.
# NOTE: llm_cache keys include provider+model, so changing the chat provider re-pays the
# whole untangle. Switch deliberately.
# The chat model does per-commit untangle + naming: the dominant cost (O(commits)). Model choice
# matters — a <=3B model is too weak; 7B is the usable floor; 14-32B is the sweet spot. Use a cloud
# API (below) or a local 14B+ on a GPU. See the README "Choosing a model & provider".
# THINKING MODELS: reasoning is billed as output and dominated the bill — Gemini 2.5 Flash
# spent 52% of its untangle tokens on it, for no measurable gain (eval 91% either way).
# Turn it off with thinking_budget = 0 (Gemini; Vertex rejects reasoning_effort = "none")
# or reasoning_effort = "low"/"none" on other endpoints.
[providers.chat]
kind = "openai"
base_url = "https://api.scaleway.ai/v1"     # any OpenAI-compatible base URL
model = "qwen3-coder-30b-a3b-instruct"
api_key = "env:YOUR_API_KEY"                # reads $YOUR_API_KEY from the environment / .env
temperature = 0.0   # deterministic decoding
seed = 7            # reproducible sampling
timeout = 120

# OPTIONAL "naming" role. Feature names come from this model, so switching it RENAMES the
# whole catalogue and churns entries you may have curated. Pin it to whatever named the
# catalogue first and change the `chat` role freely for the expensive stages. Unset, it
# falls back to `chat` and nothing changes.
# [providers.naming]
# kind = "openai"
# base_url = "https://api.scaleway.ai/v1"
# model = "qwen3-coder-30b-a3b-instruct"
# api_key = "env:YOUR_API_KEY"

# "Big model" role: dependency judgment, near-duplicate merge, `ask` — few, simple calls.
[providers.chat_large]
kind = "openai"
base_url = "https://api.scaleway.ai/v1"
model = "llama-3.3-70b-instruct"
api_key = "env:YOUR_API_KEY"
temperature = 0.0
seed = 7
timeout = 180

# Embeddings (semantic search index). Local + multilingual by default (Ollama).
[providers.embed]
kind = "ollama"
base_url = "http://localhost:11434/v1"
model = "bge-m3"
api_key = "ollama"
batch = 16
timeout = 900
